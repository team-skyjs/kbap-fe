# CI (P-050/KB-219) — push(main)+PR에서 tsc+jest+lint 래칫. 로컬 완료 기준과 동일
# (tsc 0 · jest 전체 통과 · 새 lint 위반 0). 빌드/OTA 자동화는 출시 후 — 검토 게이트 원칙.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # KB-602 래칫이 merge-base 기준 diff를 읽는다 — 얕은 클론이면 merge-base가 없다
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # 로컬 v20과 일치
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
      # KB-602: 스크립트를 package.json에 넣는 것만으론 아무것도 강제되지 않는다 —
      # **CI가 돌려야 게이트다**(Codex #175). base 브랜치를 받아 merge-base를 만든 뒤 실행.
      - name: lint ratchet (새 lint 위반 0)
        run: |
          git fetch --no-tags origin develop
          node ./scripts/lint-changed.mjs
      # KB-697: React Compiler가 렌더 중 바깥 값 읽기(시간·캐시·싱글턴)를 첫 값에 굳히는 자리 — 기준선(건별 판정) 대비 **새 항목만 경고**(비차단).
      # "통과"와 "안 돌았다"는 다르다: 0파일·컴파일 0·변환 실패·기준선 읽기 실패 = 이 단계 실패. 결과는 잡 요약(Summary)에.
      - name: compiler freeze sweep (비차단 리포트)
        run: node ./scripts/compiler-sweep.cjs
