# KB-420(P-204) — develop 푸시마다 teamtest 채널 OTA 자동 발행 (EAS Workflows).
#
# 가드(8/26 Metro 캐시 사고 재발 방지 — CLAUDE.md 배포 절차 규칙):
#   1) export는 --clear, 발행은 --clear-cache 강제.
#   2) shared teamtest-target 정본으로 BE/제품 게이트를 맞추고 산출물 호스트 검사.
#      현재 prod 리허설: 목표 1건 이상, 반대 환경 0건. 잘못된 설정/번들은 발행 전 실패.
# env는 eas.json build.teamtest와 동일하게 인라인 주입(P-073 — eas update는
# 로컬/서버 env 혼동 여지가 있어 명령 앞 인라인이 규칙).
name: teamtest OTA (develop auto-publish)

on:
  push:
    branches: ['develop']

# Codex #18 P2(직렬화): develop 연속 push 시 옛 런이 늦게 끝나며 최신 번들을
# 되덮는 OTA 롤백 방지 — 같은 브랜치 신규 런이 진행 중 런을 종료한다.
# (EAS Workflows 지원 문법: docs.expo.dev/eas/workflows/syntax — "concurrency:
#  Currently only allows setting cancel_in_progress for same-branch workflows")
concurrency:
  group: teamtest-update # eas workflow:validate 실측 — group 필수(스키마), 값은 자리표시
  cancel_in_progress: true

jobs:
  publish_teamtest:
    name: guarded teamtest update
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      # P-382(KB-561): 게이트를 export 앞에 — 불일치 푸시는 export 없이 종료
      - name: Fingerprint gate (P-199 — 네이티브 변경 시 발행 중단)
        run: |
          # 진단(런 01a06ac4 LOOKUP_FAIL 원인 추적): 러너 인증 컨텍스트 확인 —
          # "not logged in"이면 잡에 EXPO_TOKEN 자동 주입이 안 되는 케이스로 확정
          npx eas-cli whoami || echo "WHOAMI_FAIL: 러너에 EAS 인증 컨텍스트 없음"
          RV() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).hash)}catch{console.log('')}})"; }
          CUR_IOS=$(npx expo-updates fingerprint:generate --platform ios | RV)
          CUR_AND=$(npx expo-updates fingerprint:generate --platform android | RV)
          # 원출력 파일 캡처 — 실패 시 head를 로그로 남겨 빈 출력/비JSON/에러를 구분
          npx eas-cli build:list --platform ios --channel teamtest --status finished --limit 1 --json --non-interactive > /tmp/bl-ios.json 2> /tmp/bl-ios.err || true
          npx eas-cli build:list --platform android --channel teamtest --status finished --limit 1 --json --non-interactive > /tmp/bl-and.json 2> /tmp/bl-and.err || true
          # P2(fail closed): NONE = 명시적 빈 목록(통과) / LOOKUP_FAIL = 빈 출력·비JSON·필드 누락(잡 실패)
          # 방어: 23.x 계열의 {builds:[...]} 객체 형태도 수용
          PARSE() { node -e "const s=require('fs').readFileSync(process.argv[1],'utf8');if(!s.trim()){console.log('LOOKUP_FAIL');process.exit(0)}try{const j=JSON.parse(s);const a=Array.isArray(j)?j:j.builds;if(!Array.isArray(a)){console.log('LOOKUP_FAIL')}else if(a.length===0){console.log('NONE')}else{console.log(a[0].runtimeVersion||a[0].fingerprint?.hash||'LOOKUP_FAIL')}}catch{console.log('LOOKUP_FAIL')}" "$1"; }
          BUILD_IOS=$(PARSE /tmp/bl-ios.json)
          BUILD_AND=$(PARSE /tmp/bl-and.json)
          if [ "$BUILD_IOS" = "LOOKUP_FAIL" ] || [ "$BUILD_AND" = "LOOKUP_FAIL" ]; then
            echo "== 진단: build:list 원출력 head =="
            echo "-- ios stdout:"; head -c 800 /tmp/bl-ios.json || true; echo
            echo "-- ios stderr:"; head -c 800 /tmp/bl-ios.err || true; echo
            echo "-- android stdout:"; head -c 800 /tmp/bl-and.json || true; echo
            echo "-- android stderr:"; head -c 800 /tmp/bl-and.err || true; echo
          fi
          bash scripts/ota-fp-gate.sh "$CUR_IOS" "$CUR_AND" "$BUILD_IOS" "$BUILD_AND"
      - name: Export + target host guard
        run: |
          # KB-870/P-527: JSON target·build 프로필·실제 번들 호스트를 한 기준으로 검사.
          TEAMTEST_BE_BASE=$(node scripts/teamtest-target.mjs base) || exit 1
          EXPO_PUBLIC_BE_BASE="$TEAMTEST_BE_BASE" npx expo export --clear --platform ios --platform android
          node scripts/teamtest-target.mjs guard dist || exit 1
      - name: Publish to teamtest (per-platform — P-293b)
        run: |
          # P-293b: fp 게이트가 판정한 발행 가능 플랫폼만 발행(불일치 플랫폼 SKIP).
          # 캐시 규칙(--clear-cache)·env 인라인(P-073)은 플랫폼별 명령에 그대로.
          TEAMTEST_BE_BASE=$(node scripts/teamtest-target.mjs base) || exit 1
          node scripts/teamtest-target.mjs guard dist || exit 1
          PLATS=$(cat /tmp/ota-publish-platforms)
          SHA7=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          for P in $PLATS; do
            EXPO_PUBLIC_BE_BASE="$TEAMTEST_BE_BASE" npx eas-cli update \
              --channel teamtest --platform "$P" --clear-cache --non-interactive \
              --message "$SHA7 $SUBJECT"
          done
      - name: Summary
        run: |
          echo "published platforms: $(cat /tmp/ota-publish-platforms 2>/dev/null || echo '?')"
          npx eas-cli update:list --branch teamtest --limit 2 --non-interactive || true
